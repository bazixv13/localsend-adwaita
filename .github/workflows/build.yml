name: Build

on:
  push:
    branches: [main, nightly]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    container:
      image: fedora:42
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gtk4-devel libadwaita-devel glib2-devel gcc gcc-c++ \
            pkgconf-pkg-config gettext cargo rust tar gzip

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          stage=stage/localsend-adwaita
          mkdir -p "$stage"
          install -m755 target/release/localsend-adwaita "$stage/"
          install -m644 data/io.github.localsend_adwaita.LocalSend.desktop "$stage/"
          install -m644 data/io.github.localsend_adwaita.LocalSend.metainfo.xml "$stage/"
          install -m644 data/icons/scalable/apps/io.github.localsend_adwaita.LocalSend.svg "$stage/"
          install -m644 COPYING NOTICE README.md "$stage/"
          # Compile the translations next to the binary. This path is outside
          # share/locale so a Flatpak does not split it into a locale extension
          # that is only downloaded for selected languages.
          for po in po/*.po; do
            lang=$(basename "$po" .po)
            install -d "$stage/share/localsend-adwaita/locale/$lang/LC_MESSAGES"
            msgfmt --check "$po" \
              -o "$stage/share/localsend-adwaita/locale/$lang/LC_MESSAGES/localsend-adwaita.mo"
          done
          # Rolling asset used by the README, contents at the archive root.
          tar -czf "localsend-adwaita-x86_64.tar.gz" -C "$stage" .
          # Versioned asset for archiving.
          tar -czf "localsend-adwaita-${version}-x86_64.tar.gz" -C stage localsend-adwaita

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: localsend-adwaita-x86_64
          path: localsend-adwaita-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: linux
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: localsend-adwaita-x86_64
          path: dist

      - name: Publish nightly pre-release
        if: github.ref == 'refs/heads/nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly build
          body: |
            Automated build of the `nightly` branch at ${{ github.sha }}.

            Built from the latest `nightly` commit; may be unstable.
          prerelease: true
          make_latest: false
          files: dist/*.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          # Beta tags stay pre-releases so the newest stable tag keeps
          # serving /releases/latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      # A version bump on main used to sit untagged until someone pushed a tag
      # by hand. The Flatpak repo follows tags, so it kept offering the old
      # version until that happened. Tag and release whatever Cargo.toml now
      # says, once. A tag pushed with GITHUB_TOKEN cannot start the tag
      # workflows, which is why the Flatpak workflow attaches its bundle from
      # its own main run instead of relying on the tag build.
      - name: Release a new version on main
        id: main-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "${tag} is already released; leaving it alone."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "${version}" \
            --generate-notes \
            dist/*.tar.gz
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Released ${tag}."

      # The Flatpak repo rebuilds on a six-hour schedule. This asks it to
      # rebuild now, so a fresh tag reaches `flatpak update` in a minute.
      # GITHUB_TOKEN cannot write to another repository, so the job needs a
      # token with access to bazixv13/flatpak-repo in FLATPAK_REPO_TOKEN;
      # without it the scheduled run picks the release up instead.
      - name: Ask the Flatpak repo to publish this tag
        if: startsWith(github.ref, 'refs/tags/v') || steps.main-release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_REPO_TOKEN }}
          TAG: ${{ steps.main-release.outputs.tag || github.ref_name }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "FLATPAK_REPO_TOKEN is not set; the Flatpak repo picks this up on its next scheduled run."
            exit 0
          fi
          gh api --method POST repos/bazixv13/flatpak-repo/dispatches \
            -f event_type=upstream-release \
            -f client_payload[tag]="${TAG}"
