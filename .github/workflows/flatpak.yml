name: Flatpak

on:
  push:
    branches: [main, nightly]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: localsend-adw.flatpak
          manifest-path: flatpak/io.github.localsend_adwaita.LocalSend.json
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.arch }}
          branch: stable
          verbose: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: localsend-adw-${{ matrix.arch }}
          path: localsend-adw.flatpak
          if-no-files-found: error

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: localsend-adw.flatpak
          fail_on_unmatched_files: true
          generate_release_notes: true
