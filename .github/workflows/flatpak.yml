name: Flatpak

on:
  push:
    branches: [main, nightly]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flatpak bundle
    runs-on: ubuntu-24.04
    # A plain runner rather than the flatpak-github-actions container.
    # That image is a freedesktop SDK whose own runtime update fails inside
    # the container with "Invalid cross-device link" (an overlayfs limit),
    # which aborted every build before it started. Installing flatpak and
    # flatpak-builder on the runner avoids the problem entirely.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ostree rsync ca-certificates
          flatpak --version
          flatpak-builder --version
          # Install the runtime and SDK into the user installation. A system
          # install needs the polkit helper, which a runner refuses
          # ("Flatpak system operation Deploy not allowed for user"), and
          # flatpak-builder installs deps into the same scope it runs in.
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Build bundle
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --repo=repo \
            --default-branch=stable \
            --arch="${{ matrix.arch }}" \
            --state-dir=.flatpak-builder \
            build-dir \
            flatpak/io.github.localsend_adwaita.LocalSend.json

          flatpak build-bundle \
            --arch="${{ matrix.arch }}" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo localsend-adw.flatpak \
            io.github.localsend_adwaita.LocalSend stable

          ls -la localsend-adw.flatpak

      - name: Verify the bundle installs
        run: |
          export FLATPAK_USER_DIR="$RUNNER_TEMP/flatpak-check"
          mkdir -p "$FLATPAK_USER_DIR"
          flatpak install --user --noninteractive --no-deps -y localsend-adw.flatpak
          flatpak list --user --columns=ref,version | grep -i localsend

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: localsend-adw-${{ matrix.arch }}
          path: localsend-adw.flatpak
          if-no-files-found: error

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: localsend-adw.flatpak
          fail_on_unmatched_files: true
          generate_release_notes: true
