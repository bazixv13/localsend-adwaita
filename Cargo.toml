[package]
name = "localsend-adwaita"
version = "0.3.53"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"
authors = ["LocalSend Adwaita Contributors"]
description = "LocalSend client for GNOME"
repository = "https://github.com/bazixv13/localsend-adwaita"

[[bin]]
name = "localsend-adwaita"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
libadwaita = { version = "0.8", features = ["v1_6"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"

axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "fs", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
rand = "0.10"
mime_guess = "2"
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
if-addrs = "0.15"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

zbus = "5"
async-io = "2"
async-lock = "3"

[workspace]
resolver = "3"

[profile.release]
lto = "thin"
strip = true
