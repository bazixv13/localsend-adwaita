<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f97f5"/>
      <stop offset="1" stop-color="#1a63d8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f75e8"/>
      <stop offset="1" stop-color="#124da6"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7e6ff"/>
    </linearGradient>
  </defs>

  <!-- Tile matches the 12 px margin of io.github.mpobaschnig.Vaults:
       104x96 face at (12,12), extruded side 8 px lower so the lip ends at y=116. -->
  <rect x="12" y="20" width="104" height="96" rx="24" fill="url(#side)"/>
  <rect x="12" y="12" width="104" height="96" rx="24" fill="url(#background)"/>

  <!-- Top sheen -->
  <rect x="16" y="16" width="96" height="41" rx="20" fill="#ffffff" opacity="0.11"/>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-opacity="0.32" stroke-width="5.42" stroke-linecap="round">
    <path d="M21.75 89.25h10.83"/>
    <path d="M28.25 76.25h17.33"/>
  </g>

  <!-- Paper plane body -->
  <path d="M99.75 26.42 L28.25 56.75 L54.25 65.42 L62.92 93.58 L75.92 69.75 Z" fill="url(#paper)"/>
  <!-- Fold shadow -->
  <path d="M99.75 26.42 L54.25 65.42 L62.92 93.58 L75.92 69.75 Z" fill="#b9d2ff"/>
  <!-- Nose fold -->
  <path d="M99.75 26.42 L54.25 65.42 L48.83 57.83 Z" fill="#eaf2ff"/>
</svg>
